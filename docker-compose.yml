services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vmcontrol
      POSTGRES_PASSWORD: vmcontrol
      POSTGRES_DB: vmcontrol
    volumes:
      - vmcontrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmcontrol -d vmcontrol"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published publicly — only reachable on the compose network.
    # For local host access during development, uncomment:
    # ports:
    #   - "127.0.0.1:5434:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vmcontrol:vmcontrol@db:5432/vmcontrol
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-use-long-random}
      APP_URL: ${APP_URL:-http://127.0.0.1:3001}
      NODE_ENV: production
      PROXMOX_ENABLED: ${PROXMOX_ENABLED:-false}
      PROXMOX_HOST: ${PROXMOX_HOST:-}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_TLS_INSECURE: ${PROXMOX_TLS_INSECURE:-false}
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vmcontrol_pgdata:
