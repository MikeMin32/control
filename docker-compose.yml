services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vmcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vmcontrol}
    volumes:
      - vmcontrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vmcontrol} -d ${POSTGRES_DB:-vmcontrol}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres is private to the compose network (not published).
    # For local host tooling only, temporarily uncomment:
    # ports:
    #   - "127.0.0.1:5434:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vmcontrol}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vmcontrol}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_URL: ${APP_URL:-http://127.0.0.1:3001}
      NODE_ENV: production
      NEXT_DIST_DIR: .next
      PORT: "3000"
      HOST: 0.0.0.0
      PROXMOX_ENABLED: ${PROXMOX_ENABLED:-false}
      PROXMOX_HOST: ${PROXMOX_HOST:-}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_TLS_INSECURE: ${PROXMOX_TLS_INSECURE:-false}
    # Bind to loopback only — reach via WireGuard / SSH tunnel / private reverse proxy.
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  vmcontrol_pgdata:
